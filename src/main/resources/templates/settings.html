<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/settings-shell :: head('Settings')}"></head>
<body>
<div class="wrap">
  <th:block th:replace="~{fragments/settings-shell :: top}"></th:block>

  <h1>Settings</h1>

  <!-- Same pattern as the Feeds category list: one tap target per topic, so a
       Kindle never has to page through Kindle setup, legal copy, and admin
       tools to reach the one thing it opened Settings for. -->
  <ul class="category-list">
    <li>
      <a th:href="@{/settings/kindle}">
        <strong>Kindle</strong>
        <span class="meta">Send address</span>
      </a>
    </li>
    <li>
      <a th:href="@{/settings/reading}">
        <strong>Reading</strong>
        <span class="meta">Mark as read</span>
      </a>
    </li>
    <li>
      <a th:href="@{/settings/account}">
        <strong>Account</strong>
        <span class="meta" th:text="${account.email}">you@example.com</span>
      </a>
    </li>
    <li th:if="${billingEnabled}">
      <a th:href="@{/settings/subscription}">
        <strong>Subscription</strong>
        <span class="meta">Plan and billing</span>
      </a>
    </li>
    <li>
      <a id="changelog" th:href="@{/settings/changelog}">
        <strong>Changelog</strong>
        <span class="meta">What changed</span>
      </a>
    </li>
    <li>
      <a th:href="@{/settings/data}">
        <strong>Your data</strong>
        <span class="meta">Export</span>
      </a>
    </li>
    <li th:if="${admin}">
      <a th:href="@{/admin}">
        <strong>Telemetry</strong>
        <span class="meta">Usage</span>
      </a>
    </li>
  </ul>

  <p class="meta" style="margin-top:1rem">
    Version <strong th:text="${appVersion.number}">development build</strong>
    · <span th:text="${appVersion.revision}">unknown</span>
    · <span th:text="${appVersion.builtAt}">unknown</span>
  </p>

  <div th:replace="~{fragments/site-footer :: siteFooter}"></div>
</div>
</body>
</html>
