<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Create account — Extrablatt</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="wrap">
  <header class="app">
    <span class="brand">Extrablatt</span>
  </header>

  <h1>Create your account</h1>
  <div th:if="${error}" class="flash error" th:text="${error}"></div>

  <form th:action="@{/register}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="email" th:value="${email}" required/>

    <label for="password" style="margin-top:0.75rem">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password"
           minlength="8" required/>
    <p class="meta">At least 8 characters. You will confirm your e-mail before sending to Kindle.</p>

    <div class="row" style="margin-top:1rem">
      <button class="btn" type="submit">Create account</button>
    </div>
  </form>

  <p class="meta" style="margin-top:1rem">
    Already have an account? <a th:href="@{/login}">Log in</a>
  </p>
  <p class="meta">
    By creating an account you agree to the
    <a th:href="@{/terms}">Terms</a> and <a th:href="@{/privacy}">Privacy Policy</a>.
  </p>
</div>
</body>
</html>
