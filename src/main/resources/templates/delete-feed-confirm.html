<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:classappend="${einkLayout} ? ('eink' + ${einkTypeClasses})">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Delete this feed? - Extrablatt</title>
  <th:block th:replace="~{fragments/page-styles :: assets}"></th:block>
</head>
<body class="has-tabbar">
<th:block th:replace="~{fragments/app-shell :: appBar('feeds')}"></th:block>
<main id="main" class="wrap">

  <h1>Delete this feed?</h1>

  <p>
    <strong th:text="${feed.title}">Feed title</strong>
    and all of its articles will be removed. This cannot be undone.
  </p>

  <!-- A real form and a plain link, so it works without any script (e-ink browsers). -->
  <form th:action="@{/feeds/{id}/delete(id=${feed.id})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" name="redirect" th:value="${redirect}"/>
    <div class="actions">
      <button class="btn danger" type="submit">Delete feed</button>
      <a class="btn" th:href="@{${redirect}}">Cancel</a>
    </div>
  </form>
</main>
<nav th:replace="~{fragments/app-shell :: tabBar('feeds')}"></nav>
</body>
</html>
