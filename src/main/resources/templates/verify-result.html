<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:classappend="${einkLayout} ? 'eink'">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Confirm e-mail — Extrablatt</title>
  <th:block th:replace="~{fragments/page-styles :: assets}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/app-shell :: brandBar}"></th:block>
<main id="main" class="wrap">

  <h1 th:text="${verified} ? 'E-mail confirmed' : 'Confirmation failed'">Confirm e-mail</h1>
  <div class="flash" th:classappend="${verified} ? '' : ' error'" th:text="${message}">
    Confirmation result
  </div>
  <p><a class="btn" th:href="@{/login}">Go to login</a></p>
</main>
</body>
</html>
