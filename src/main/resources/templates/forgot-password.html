<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Reset password — Kindle RSS</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="wrap">
  <header class="app">
    <span class="brand">Kindle RSS</span>
  </header>

  <h1>Reset your password</h1>
  <p class="meta">Enter your account e-mail and we will send a reset link.</p>

  <form th:action="@{/forgot-password}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="email" required/>
    <div class="row" style="margin-top:1rem">
      <button class="btn" type="submit">Send reset link</button>
    </div>
  </form>

  <p class="meta" style="margin-top:1rem">
    <a th:href="@{/login}">Back to log in</a>
  </p>
</div>
</body>
</html>
