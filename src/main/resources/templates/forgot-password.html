<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:classappend="${einkLayout} ? ('eink' + ${einkTypeClasses})">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Reset password — Extrablatt</title>
  <th:block th:replace="~{fragments/page-styles :: assets}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/app-shell :: brandBar}"></th:block>
<main id="main" class="wrap">

  <h1>Reset your password</h1>
  <p class="meta">Enter your account e-mail and we will send a reset link.</p>

  <form th:action="@{/forgot-password}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="email" required/>
    <div class="row space-top">
      <button class="btn primary" type="submit">Send reset link</button>
    </div>
  </form>

  <p class="meta space-top">
    <a th:href="@{/login}">Back to log in</a>
  </p>
</main>
</body>
</html>
