<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Error — Extrablatt</title>
  <th:block th:replace="~{fragments/page-styles :: assets}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/app-shell :: brandBar}"></th:block>
<main id="main" class="wrap">
  <div class="error-box">
    <h1>Something went wrong</h1>
    <p th:text="${message} ?: 'Not found'">Not found</p>
    <p><a class="btn" th:href="@{/}">Back to feeds</a></p>
  </div>
</main>
</body>
</html>
