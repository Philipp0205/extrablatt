<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Set a new password — Extrablatt</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="wrap">
  <header class="app">
    <span class="brand">Extrablatt</span>
  </header>

  <h1>Set a new password</h1>
  <div th:if="${error}" class="flash error" th:text="${error}"></div>

  <form th:action="@{/reset-password}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" name="token" th:value="${token}"/>
    <label for="password">New password</label>
    <input id="password" name="password" type="password" autocomplete="new-password"
           minlength="8" required/>
    <p class="meta">At least 8 characters.</p>
    <div class="row" style="margin-top:1rem">
      <button class="btn" type="submit">Update password</button>
    </div>
  </form>

  <p class="meta" style="margin-top:1rem">
    <a th:href="@{/login}">Back to log in</a>
  </p>
</div>
</body>
</html>
