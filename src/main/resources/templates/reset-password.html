<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:classappend="${einkLayout} ? 'eink'">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Set a new password — Extrablatt</title>
  <th:block th:replace="~{fragments/page-styles :: assets}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/app-shell :: brandBar}"></th:block>
<main id="main" class="wrap">

  <h1>Set a new password</h1>
  <div th:if="${error}" class="flash error" th:text="${error}"></div>

  <form th:action="@{/reset-password}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" name="token" th:value="${token}"/>
    <label for="password">New password</label>
    <input id="password" name="password" type="password" autocomplete="new-password"
           minlength="8" required/>
    <p class="meta">8 to 72 characters (accented letters count as two, emoji as four).</p>
    <div class="row space-top">
      <button class="btn" type="submit">Update password</button>
    </div>
  </form>

  <p class="meta space-top">
    <a th:href="@{/login}">Back to log in</a>
  </p>
</main>
</body>
</html>
