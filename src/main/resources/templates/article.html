<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:classappend="${einkLayout} ? 'eink'">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title th:text="${article.title} + ' — Extrablatt'">Article — Extrablatt</title>
  <th:block th:replace="~{fragments/page-styles :: assets}"></th:block>
</head>
<body>
<!-- Immersive reading: no brand bar and no tab bar, so the screen is the article. The
     back link below is the way out, and it is the page's place in the navigation. -->
<a class="skip-link" href="#main">Skip to content</a>
<main id="main" class="wrap reading-column">
  <!-- The way back, sending, and the rarer actions behind More. Back is a link to
       the list; app.js turns it into the browser's own back when the reader came
       from the list, so the list comes back where it was scrolled to. -->
  <div class="article-tools">
    <span class="back-link" data-back-link>
      <a th:href="@{/items}" aria-current="page">
        <span aria-hidden="true">←</span> <span class="back-word">Articles</span>
      </a>
    </span>
    <form class="inline" data-send-form
          th:action="@{/articles/{id}/send(id=${article.id})}"
          th:attr="data-send-url=@{/articles/{id}/send-async(id=${article.id})}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" name="images" th:value="${images}"/>
      <button class="btn send-tool" type="submit">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 12l16-8-6 16-2.5-6.5z"/>
          <path d="M11.5 13.5L20 4"/>
        </svg>
        <span data-send-label>Send to Kindle</span>
      </button>
    </form>
    <details class="action-menu" data-action-menu>
      <summary class="btn" aria-label="More actions">More</summary>
      <div class="action-menu-items">
        <a class="btn" th:if="${originalUrl != null}" th:href="${originalUrl}"
           rel="noopener noreferrer">Original</a>
        <a class="btn" th:if="${commentsUrl != null}" th:href="${commentsUrl}"
           rel="noopener noreferrer">Comments</a>
        <a class="btn" th:if="${!images}"
           th:href="@{/articles/{id}(id=${article.id}, images=true)}">Show images</a>
        <a class="btn" th:if="${images}"
           th:href="@{/articles/{id}(id=${article.id})}">Hide images</a>
        <form class="inline" th:action="@{/articles/{id}/read(id=${article.id})}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="read" value="false"/>
          <input type="hidden" name="redirect" th:value="@{/articles/{id}(id=${article.id})}"/>
          <button class="btn" type="submit">Mark unread</button>
        </form>
      </div>
    </details>
  </div>

  <div th:if="${message}" class="flash" role="status" th:text="${message}"></div>
  <div th:if="${error}" class="flash error" role="alert" th:text="${error}"></div>
  <!-- Where app.js writes the reason a send did not happen. Empty, and so taking up
       no room, until there is something to say. -->
  <div data-send-feedback th:attr="data-send-settings-url=@{/settings/kindle}"></div>
  <div th:replace="~{fragments/trial-ended-dialog :: trialEndedDialog}"></div>
  <div th:replace="~{fragments/whats-new-dialog :: whatsNewDialog}"></div>

  <article>
    <header class="article-head">
      <p class="item-meta">
        <span class="source" th:text="${article.feedTitle}">Feed</span>
        <th:block th:if="${article.publishedAt != null}">
          <span class="sep" aria-hidden="true">·</span>
          <time th:datetime="${article.publishedAt.toString()}"
                th:text="${readableTime.describe(article.publishedAt)}">3 hours ago</time>
        </th:block>
        <th:block th:if="${article.sentAt != null}">
          <span class="sep" aria-hidden="true">·</span>
          <span>Sent to Kindle</span>
        </th:block>
      </p>
      <h1 th:text="${article.title}">Title</h1>
      <p class="meta" th:if="${article.author != null}" th:text="'By ' + ${article.author}">By Author</p>
    </header>
    <div class="article-body" th:utext="${contentHtml}">Content</div>
  </article>

  <!-- The end of an article is where the decision to keep it is made, so sending is
       offered again here rather than only at the top. -->
  <div class="article-end">
    <form class="inline" data-send-form
          th:action="@{/articles/{id}/send(id=${article.id})}"
          th:attr="data-send-url=@{/articles/{id}/send-async(id=${article.id})}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" name="images" th:value="${images}"/>
      <button class="btn primary" type="submit">
        <span data-send-label>Send to Kindle</span>
      </button>
    </form>
    <a class="btn" data-back-link th:href="@{/items}">Back to articles</a>
  </div>
</main>
</body>
</html>
