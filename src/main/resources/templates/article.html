<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${article.title} + ' — Extrablatt'">Article — Extrablatt</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="reading">
<div class="wrap">
  <header class="app compact">
    <nav class="top">
      <a class="btn" th:href="@{/items}">Articles</a>
      <a class="btn" th:if="${originalUrl != null}" th:href="${originalUrl}" rel="noopener noreferrer">Original</a>
      <a class="btn" th:if="${commentsUrl != null}" th:href="${commentsUrl}"
         rel="noopener noreferrer">Comments</a>
      <a class="btn" th:if="${!images}" th:href="@{/articles/{id}(id=${article.id}, images=true)}">Show images</a>
      <a class="btn" th:if="${images}" th:href="@{/articles/{id}(id=${article.id})}">Hide images</a>
      <form class="inline" data-send-form
            th:action="@{/articles/{id}/send(id=${article.id})}"
            th:attr="data-send-url=@{/articles/{id}/send-async(id=${article.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="images" th:value="${images}"/>
        <button class="btn" type="submit">Send to Kindle</button>
      </form>
      <form class="inline" th:action="@{/articles/{id}/read(id=${article.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="read" value="false"/>
        <input type="hidden" name="redirect" th:value="@{/articles/{id}(id=${article.id})}"/>
        <button class="btn" type="submit">Mark unread</button>
      </form>
    </nav>
  </header>

  <div th:if="${message}" class="flash" th:text="${message}"></div>
  <div th:if="${error}" class="flash error" th:text="${error}"></div>
  <div th:replace="~{fragments/donation-dialog :: donationDialog}"></div>

  <div class="reader" data-reader th:attr="data-reader-key='article-' + ${article.id}">
    <div class="reader-frame" data-reader-frame>
      <div class="reader-content" data-reader-content>
        <h1 th:text="${article.title}">Title</h1>
        <div class="meta">
          <span th:text="${article.feedTitle}">Feed</span>
          <span th:if="${article.author != null}" th:text="' · ' + ${article.author}"></span>
          <span th:if="${article.publishedAt != null}"
                th:text="' · ' + ${#temporals.format(article.publishedAt, 'yyyy-MM-dd HH:mm')}"></span>
          <span th:if="${article.sentAt != null}"> · sent to Kindle</span>
        </div>
        <article class="article-body" th:utext="${contentHtml}">Content</article>
      </div>
    </div>
    <nav class="pager" data-reader-pager>
      <button class="btn" type="button" data-reader-prev>Previous page</button>
      <span class="pager-label" data-reader-label>Page 1</span>
      <button class="btn" type="button" data-reader-next>Next page</button>
    </nav>
  </div>
</div>
<script th:src="@{/js/reader.js}"></script>
</body>
</html>
