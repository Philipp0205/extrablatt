<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Shown once per release when the account has not yet acknowledged the latest
  changelog entry. Rendered `open` by the server (no JavaScript). Dismissing
  posts to /settings/changelog/ack so the notice does not return until the next
  release is shipped.
-->
<div th:fragment="whatsNewDialog">
  <dialog id="whats-new-dialog" class="donate-dialog" th:if="${whatsNewPrompt}" open>
    <h2>What's new</h2>
    <p class="meta" th:if="${whatsNew.date}" th:text="${whatsNew.date}">date</p>
    <p th:if="${whatsNew.title}" th:text="${whatsNew.title}">title</p>
    <ul class="changelog-list">
      <li th:each="item : ${whatsNew.popupItems()}" th:text="${item}">change</li>
    </ul>
    <div class="row">
      <a class="btn" th:href="@{/settings#changelog}">All changes</a>
      <form th:action="@{/settings/changelog/ack}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="redirect" th:value="${changelogRedirect}"/>
        <button class="btn primary" type="submit">Got it</button>
      </form>
    </div>
  </dialog>
</div>
</body>
</html>
