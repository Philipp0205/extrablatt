<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Confirm your cancellation - Extrablatt</title>
  <th:block th:replace="~{fragments/page-styles :: assets}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/app-shell :: brandBar}"></th:block>
<main id="main" class="wrap">

  <h1>Confirm your cancellation</h1>

  <div class="receipt">
    <dl>
      <dt>Received</dt>
      <dd><span th:text="${receivedAt}">1 September 2026 at 09:14</span> (Central European Time)</dd>

      <dt>Type</dt>
      <dd th:if="${immediate}">Immediate (extraordinary) cancellation</dd>
      <dd th:unless="${immediate}">Ordinary cancellation</dd>
    </dl>
  </div>

  <!-- A button rather than the link itself, because mail scanners and link previews
       open links; only a person pressing this ends the subscription. -->
  <form th:action="@{/cancel/confirm}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" name="token" th:value="${token}"/>
    <div class="actions">
      <button class="btn danger" type="submit">Cancel now</button>
      <a class="btn" th:href="@{/}">Keep my subscription</a>
    </div>
  </form>

  <p class="meta">
    If you did not ask for this, leave this page: nothing changes.
  </p>
</main>
</body>
</html>
