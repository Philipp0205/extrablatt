<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Check your inbox — Extrablatt</title>
  <th:block th:replace="~{fragments/page-styles :: assets}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/app-shell :: brandBar}"></th:block>
<main id="main" class="wrap">

  <h1>Check your inbox</h1>

  <div class="flash sent">
    <p th:if="${sentTo != null}">
      We sent an e-mail to <strong th:text="${sentTo}">you@example.com</strong>.
    </p>
    <p th:if="${sentTo == null}">We sent you an e-mail.</p>
    <p class="meta" th:text="${instruction}">Open the link in that message to continue.</p>
  </div>

  <p class="meta">
    Nothing after a few minutes? Check your spam folder, then
    <a th:href="${retryPath} ?: @{/register}">try again</a>.
  </p>

  <p class="meta">
    <a th:href="@{/login}">Back to log in</a>
  </p>
</main>
</body>
</html>
