<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="robots" content="noindex"/>
  <title>Extrablatt</title>
  <!-- For the real form posts (sign out, delete account); read by settings.js. -->
  <meta name="csrf-token" th:content="${_csrf.token}"/>
  <meta name="color-scheme" content="light dark"/>
  <meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark) and (max-width: 719px)"/>
  <meta name="theme-color" content="#f4eee1" media="(prefers-color-scheme: light) and (max-width: 719px)"/>
  <meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)"/>
  <meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)"/>
  <link rel="stylesheet" th:href="@{/app-kit/ak-tokens.css}"/>
  <link rel="stylesheet" th:href="@{/app-kit/ak-components.css}"/>
  <link rel="stylesheet" th:href="@{/app-kit/app-kit.css}"/>
  <link rel="stylesheet" th:href="@{/css/preview.css}"/>
  <script th:src="@{/app-kit/theme-color.js}" defer></script>
  <script th:src="@{/app-kit/ak-dom.js}" defer></script>
  <script th:src="@{/app-kit/ak-tabbar.js}" defer></script>
  <script th:src="@{/app-kit/ak-toast.js}" defer></script>
  <script th:src="@{/app-kit/ak-sheet.js}" defer></script>
  <script th:src="@{/app-kit/ak-nav.js}" defer></script>
  <script th:src="@{/js/preview/api.js}" defer></script>
  <script th:src="@{/js/preview/send.js}" defer></script>
  <script th:src="@{/js/preview/articles.js}" defer></script>
  <script th:src="@{/js/preview/reader.js}" defer></script>
  <script th:src="@{/js/preview/feeds.js}" defer></script>
  <script th:src="@{/js/preview/settings.js}" defer></script>
  <script th:src="@{/js/preview/legal.js}" defer></script>
  <script th:src="@{/js/preview/whatsnew.js}" defer></script>
  <script th:src="@{/js/preview/app.js}" defer></script>
</head>
<body>
<div class="pv-shell">
  <!-- Desktop only; on a phone the tab bar that app.js adds takes its place. -->
  <nav class="pv-side" aria-label="Main">
    <a class="pv-brand" href="#/articles">Extrablatt</a>
    <ul class="pv-sidenav">
      <li><a href="#/articles" data-route="articles">Articles</a></li>
      <li><a href="#/feeds" data-route="feeds">Feeds</a></li>
      <li><a href="#/settings" data-route="settings">Settings</a></li>
    </ul>
  </nav>
  <main id="main" class="pv-main">
    <noscript>
      <p class="pv-note">This preview needs JavaScript. <a th:href="@{/}">Use the current app</a> instead.</p>
    </noscript>
    <div id="pv-screens" class="pv-screens"></div>
  </main>
</div>
</body>
</html>
