<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:class="${display.bodyClasses()}">
<head th:replace="~{accessible/fragments/page :: head('Confirming your e-mail')}"></head>
<body>
<div th:replace="~{accessible/fragments/page :: top-signed-out}"></div>

<main id="main" class="page">
  <h1 th:text="${verified} ? 'Your e-mail is confirmed' : 'That link did not work'">Confirming your e-mail</h1>

  <p class="message" role="status"
     th:classappend="${verified} ? ' good' : ' bad'" th:text="${message}">Result</p>

  <div class="stack">
    <a class="btn btn-strong" th:href="@{/login}">Sign in</a>
    <a class="btn" th:href="@{/help}">Help</a>
  </div>
</main>

<footer th:replace="~{accessible/fragments/page :: foot}"></footer>
<script th:src="@{/js/a11y.js}" defer></script>
</body>
</html>
