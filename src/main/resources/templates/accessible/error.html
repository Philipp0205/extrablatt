<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:class="${display.bodyClasses()}">
<head th:replace="~{accessible/fragments/page :: head('Something went wrong')}"></head>
<body>
<div th:replace="~{accessible/fragments/page :: top-signed-out}"></div>

<main id="main" class="page">
  <h1>Something went wrong</h1>
  <p class="message bad" role="status" th:text="${message} ?: 'We could not find that page.'">
    We could not find that page.
  </p>
  <p>Nothing has been lost, and nothing you did caused this.</p>

  <div class="stack">
    <a class="btn btn-strong" th:href="@{/topics}">Back to your topics</a>
    <a class="btn" th:href="@{/list(show='new')}">New articles</a>
    <a class="btn" th:href="@{/help}">Help</a>
  </div>
</main>

<footer th:replace="~{accessible/fragments/page :: foot}"></footer>
<script th:src="@{/js/a11y.js}" defer></script>
</body>
</html>
