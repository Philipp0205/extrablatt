<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:class="${display.bodyClasses()}">
<head th:replace="~{accessible/fragments/page :: head('Set a new password')}"></head>
<body>
<div th:replace="~{accessible/fragments/page :: top-signed-out}"></div>

<main id="main" class="page">
  <h1>Set a new password</h1>

  <div class="messages" role="status" aria-live="polite">
    <p class="message bad" th:if="${error}" th:text="${error}"></p>
  </div>

  <form th:action="@{/reset-password}" method="post" class="form-stack">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" name="token" th:value="${token}"/>
    <label for="password">Your new password</label>
    <input id="password" name="password" type="password" autocomplete="new-password"
           required minlength="8" autofocus aria-describedby="password-help"/>
    <p id="password-help" class="quiet">At least 8 characters.</p>
    <button class="btn btn-strong" type="submit">Save my new password</button>
  </form>

  <div class="stack">
    <a class="btn" th:href="@{/login}">Back to signing in</a>
  </div>
</main>

<footer th:replace="~{accessible/fragments/page :: foot}"></footer>
<script th:src="@{/js/a11y.js}" defer></script>
</body>
</html>
