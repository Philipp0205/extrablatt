<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:class="${display.bodyClasses()}">
<head th:replace="~{accessible/fragments/page :: head(${heading})}"></head>
<body>
<div th:replace="~{accessible/fragments/page :: top('list')}"></div>

<main id="main" class="page">
  <div th:replace="~{accessible/fragments/page :: messages}"></div>

  <h1 th:text="${heading}">Articles</h1>

  <p class="lede" th:if="${total > 0}">
    <span th:text="${total}">0</span>
    <span th:text="${onlyNew} ? 'new articles' : 'articles'">articles</span><span
      th:if="${totalPages > 1}" th:text="' · page ' + ${page} + ' of ' + ${totalPages}"></span>.
  </p>

  <div class="stack stack-tight">
    <a class="btn" th:href="@{${otherViewPath}}"
       th:text="${onlyNew} ? 'Show everything, including what I have read' : 'Show only new articles'">
      Show all articles</a>
    <form th:action="@{/refresh}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" name="redirect" th:value="${listPath}"/>
      <button class="btn" type="submit">Check for new articles now</button>
    </form>
  </div>

  <p class="panel" th:if="${#lists.isEmpty(articles)}">
    <span th:if="${onlyNew}">Nothing new here at the moment. You have read everything.</span>
    <span th:unless="${onlyNew}">There are no articles here yet. New ones arrive on their own,
      or you can check now with the button above.</span>
  </p>

  <ul class="article-list" th:if="${!#lists.isEmpty(articles)}">
    <th:block th:each="a : ${articles}">
      <li th:replace="~{accessible/fragments/page :: articleRow(${a}, ${listPath})}"></li>
    </th:block>
  </ul>

  <nav class="pager" aria-label="More articles" th:if="${previousPath != null or nextPath != null}">
    <a class="btn" th:if="${previousPath != null}" th:href="@{${previousPath}}">Newer articles</a>
    <a class="btn" th:if="${nextPath != null}" th:href="@{${nextPath}}">Older articles</a>
  </nav>
</main>

<footer th:replace="~{accessible/fragments/page :: foot}"></footer>
<script th:src="@{/js/a11y.js}" defer></script>
</body>
</html>
