<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:class="${display.bodyClasses()}">
<head th:replace="~{accessible/fragments/page :: head('Right of withdrawal')}"></head>
<body>
<div th:replace="~{accessible/fragments/page :: top-signed-out}"></div>

<main id="main" class="page prose">
  <!-- The same notice the standard edition shows, in this edition's layout. -->
  <div th:replace="~{withdrawal :: content}"></div>

  <div class="stack">
    <a class="btn" th:href="@{/cancel}">Cancel your contract here</a>
    <a class="btn btn-quiet" th:href="@{/topics}">Back to your topics</a>
  </div>
</main>

<footer th:replace="~{accessible/fragments/page :: foot}"></footer>
<script th:src="@{/js/a11y.js}" defer></script>
</body>
</html>
