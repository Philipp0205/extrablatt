<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:class="${display.bodyClasses()}">
<head th:replace="~{accessible/fragments/page :: head('Forgotten password')}"></head>
<body>
<div th:replace="~{accessible/fragments/page :: top-signed-out}"></div>

<main id="main" class="page">
  <h1>Forgotten password</h1>
  <p class="lede">Tell us your e-mail address and we will send you a link for
    setting a new password.</p>

  <div class="messages" role="status" aria-live="polite">
    <p class="message bad" th:if="${error}" th:text="${error}"></p>
    <p class="message good" th:if="${message}" th:text="${message}"></p>
  </div>

  <form th:action="@{/forgot-password}" method="post" class="form-stack">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label for="email">Your e-mail address</label>
    <input id="email" name="email" type="email" autocomplete="email" required autofocus/>
    <button class="btn btn-strong" type="submit">Send me the link</button>
  </form>

  <div class="stack">
    <a class="btn" th:href="@{/login}">Back to signing in</a>
  </div>
</main>

<footer th:replace="~{accessible/fragments/page :: foot}"></footer>
<script th:src="@{/js/a11y.js}" defer></script>
</body>
</html>
