<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/settings-shell :: head('Reading')}"></head>
<body>
<div class="wrap">
  <th:block th:replace="~{fragments/settings-shell :: top}"></th:block>

  <a class="back-link" th:href="@{/settings}">← Settings</a>
  <h1>Reading</h1>
  <p class="meta">Choose how articles become marked as read.</p>
  <form th:action="@{/settings/reading}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label class="check">
      <input type="checkbox" name="markReadOnNextPage" value="true"
             th:checked="${account.markReadOnNextPage}"/>
      <span>Mark articles as read when I go to the next page</span>
    </label>
    <p class="meta">When this is on, paging past a list of articles marks them read.
      When it is off, new articles arrive already marked read, so Unread stays empty
      until you open something, and Next page only loads more articles.</p>
    <div class="row" style="margin-top:1rem">
      <button class="btn" type="submit">Save</button>
    </div>
  </form>

  <div th:replace="~{fragments/site-footer :: siteFooter}"></div>
</div>
</body>
</html>
