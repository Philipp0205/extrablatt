<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Articles — Extrablatt</title>
  <th:block th:replace="~{fragments/page-styles :: assets}"></th:block>
</head>
<body class="has-tabbar">
<th:block th:replace="~{fragments/app-shell :: appBar('articles')}"></th:block>
<main id="main" class="wrap">
  <div th:replace="~{fragments/trial-banner :: trialBanner}"></div>
  <div th:if="${message}" class="flash" role="status" th:text="${message}"></div>
  <div th:if="${error}" class="flash error" role="alert" th:text="${error}"></div>
  <!-- Where app.js writes the reason a send did not happen. Empty, and so taking up
       no room, until there is something to say. -->
  <div data-send-feedback th:attr="data-send-settings-url=@{/settings/kindle}"></div>
  <div th:replace="~{fragments/trial-ended-dialog :: trialEndedDialog}"></div>
  <div th:replace="~{fragments/whats-new-dialog :: whatsNewDialog}"></div>

  <div class="list-head">
    <h1>Articles</h1>
    <p class="meta" data-unread-count th:if="${total > 0}"
       th:text="${unreadLeft == 0} ? 'All read' : ${unreadLeft} + ' unread'">20 unread</p>
  </div>

  <!-- One row of filters, whichever level it is on: the categories, or the feeds of
       the category that is open. The way out and the unread switch stand ahead of
       the row and never scroll; the row itself scrolls sideways on a phone and wraps
       on a wide screen. -->
  <nav class="filters" data-strip aria-label="Filter articles">
    <a class="chip filter-nav" th:if="${backChip != null}"
       th:href="@{${backChip.href}}" aria-label="All categories">
      <span aria-hidden="true">←</span>
      <span class="nav-word" th:text="${backChip.label}">All</span>
    </a>
    <a class="chip filter-mode"
       th:classappend="${modeChip.active} ? 'active'"
       th:href="@{${modeChip.href}}"
       th:attr="aria-pressed=${modeChip.active} ? 'true' : 'false'">
      <span class="mode-dot" aria-hidden="true"></span>
      <span th:text="${modeChip.label}">Unread</span>
    </a>
    <span class="filter-divide" aria-hidden="true"></span>
    <div class="strip" data-strip-track>
      <a class="chip" th:each="chip : ${filterChips}"
         th:classappend="${chip.active} ? 'active'"
         th:attr="aria-current=${chip.active} ? 'true' : null"
         th:href="@{${chip.href}}"
         th:text="${chip.label}">Category</a>
    </div>
  </nav>

  <a class="btn quiet" th:if="${page > 1}" rel="prev"
     th:href="@{${prevPath}}">Newer articles</a>

  <div th:if="${#lists.isEmpty(articles)}" class="empty">
    <strong th:text="${unread} ? 'You are all caught up' : 'No articles yet'">You are all caught up</strong>
    <span th:if="${unread}">New articles from your feeds show up here.</span>
    <span th:unless="${unread}">Follow a site under Feeds to start reading.</span>
  </div>

  <ul class="item-list" data-item-list th:if="${!#lists.isEmpty(articles)}">
    <li th:replace="~{fragments/article-rows :: rows}"></li>
  </ul>

  <!-- Under the list: where the column stands, a way to load more, and the one
       explicit way to mark the whole sitting read. Load-more is a plain link to the
       next page; app.js turns it into an in-place append and writes the extended
       range into the address, so a reload or the back button returns here. -->
  <div class="list-end" th:if="${!#lists.isEmpty(articles)}">
    <p class="meta list-range" data-list-range
       th:text="${firstIndex} + '–' + ${lastIndex} + ' of ' + ${total} + ' articles'">1–20 of 20 articles</p>
    <div class="row">
      <th:block th:replace="~{fragments/article-rows :: loadMore}"></th:block>
      <form class="mark-read-form" data-mark-read-form th:action="@{/items/mark-read}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="feed" th:if="${feedId != null}" th:value="${feedId}"/>
        <input type="hidden" name="category" th:if="${category != null}" th:value="${category}"/>
        <input type="hidden" name="unread" th:value="${unread}"/>
        <input type="hidden" name="snapshot" th:if="${snapshot != null}" th:value="${snapshot}"/>
        <input type="hidden" name="page" th:value="${page}"/>
        <input type="hidden" name="through" data-mark-read-through th:value="${through}"/>
        <!-- The rows this page was rendered with. app.js rewrites these from every row
             on screen when the form is sent, including the ones load-more added. -->
        <input type="hidden" name="id" data-mark-read-id th:each="a : ${articles}" th:value="${a.id}"/>
        <button class="btn" type="submit">Mark all as read</button>
      </form>
    </div>
  </div>
  <p class="offscreen" data-list-status role="status" aria-live="polite"></p>

  <div th:replace="~{fragments/site-footer :: siteFooter}"></div>
</main>
<nav th:replace="~{fragments/app-shell :: tabBar('articles')}"></nav>

</body>
</html>
