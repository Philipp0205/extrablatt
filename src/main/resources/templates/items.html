<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Articles — Kindle RSS</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="wrap">
  <header class="app">
    <a class="brand" th:href="@{/}">Kindle RSS</a>
    <nav class="top">
      <a th:href="@{/}">Feeds</a>
      <a th:href="@{/items}">Articles</a>
      <a th:href="@{/items(unread=true)}">Unread</a>
      <form class="inline" th:action="@{/refresh}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">Refresh</button>
      </form>
      <form class="inline" th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">Log out</button>
      </form>
    </nav>
  </header>

  <div th:if="${message}" class="flash" th:text="${message}"></div>
  <div th:if="${error}" class="flash error" th:text="${error}"></div>

  <h1>Articles</h1>
  <p class="meta" th:text="${total} + ' matching · page ' + ${page} + ' of ' + ${totalPages}">0 matching</p>

  <div class="filters">
    <a class="btn" th:classappend="${feedId == null and !unread} ? ' active'" th:href="@{/items}">All</a>
    <a class="btn" th:classappend="${unread and feedId == null} ? ' active'" th:href="@{/items(unread=true)}">Unread</a>
    <a class="btn" th:each="f : ${feeds}"
       th:classappend="${feedId != null and feedId == f.id} ? ' active'"
       th:href="@{/items(feed=${f.id}, unread=${unread} ? true : null)}"
       th:text="${f.title}">Feed</a>
  </div>

  <p th:if="${#lists.isEmpty(articles)}" class="muted">No articles.</p>
  <ul class="item-list" th:if="${!#lists.isEmpty(articles)}">
    <li th:each="a : ${articles}">
      <div>
        <strong th:if="${!a.read}">● </strong>
        <a th:href="@{/articles/{id}(id=${a.id})}" th:text="${a.title}">Title</a>
      </div>
      <div class="meta">
        <span th:text="${a.feedTitle}">Feed</span>
        <span th:if="${a.publishedAt != null}" th:text="' · ' + ${#temporals.format(a.publishedAt, 'yyyy-MM-dd HH:mm')}"> · date</span>
        <span th:if="${a.sentAt != null}"> · sent</span>
      </div>
      <div class="actions">
        <a class="btn" th:href="@{/articles/{id}(id=${a.id})}">Read</a>
        <form class="inline" th:action="@{/articles/{id}/send(id=${a.id})}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit">Send to Kindle</button>
        </form>
        <form class="inline" th:action="@{/articles/{id}/read(id=${a.id})}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="read" th:value="${!a.read}"/>
          <input type="hidden" name="redirect" value="/items"/>
          <button type="submit" th:text="${a.read} ? 'Mark unread' : 'Mark read'">Mark read</button>
        </form>
      </div>
    </li>
  </ul>

  <div class="pagination" th:if="${totalPages > 1}">
    <a class="btn" th:if="${page > 1}"
       th:href="@{/items(feed=${feedId}, unread=${unread} ? true : null, page=${page - 1})}">Previous</a>
    <span th:text="'Page ' + ${page} + ' / ' + ${totalPages}">Page 1</span>
    <a class="btn" th:if="${page < totalPages}"
       th:href="@{/items(feed=${feedId}, unread=${unread} ? true : null, page=${page + 1})}">Next</a>
  </div>
</div>
</body>
</html>
