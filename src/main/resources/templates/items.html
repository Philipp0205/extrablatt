<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Articles — Extrablatt</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="reading">
<div class="wrap">
  <header class="app compact">
    <nav class="top">
      <a class="btn" th:href="@{/}">Feeds</a>
      <a class="btn active" aria-current="page" th:href="@{/items}">Articles</a>
      <a class="btn" th:href="@{/settings}">Settings</a>
    </nav>
  </header>

  <div th:if="${message}" class="flash" th:text="${message}"></div>
  <div th:if="${error}" class="flash error" th:text="${error}"></div>
  <div th:replace="~{fragments/whats-new-dialog :: whatsNewDialog}"></div>

  <!-- The article list always opens at the top: unlike a single article, there is
       no reading position worth restoring, and returning to "Articles" should show
       page one from its start. -->
  <div class="reader" data-reader data-reader-restore="false"
       th:attr="data-reader-key='items-' + ${feedId} + '-' + ${category} + '-' + ${unread} + '-' + ${snapshot} + '-' + ${page},
                data-reader-prev-url=${page > 1} ? @{/items(feed=${feedId}, category=${category}, unread=${unread} ? true : null, snapshot=${snapshot}, page=${page - 1})} : null,
                data-reader-next-form=${!#lists.isEmpty(articles)} ? 'advance' : null,
                data-reader-next-end-label=${forwardLabel},
                data-reader-mark-form=${markReadOnNextPage and !#lists.isEmpty(articles)} ? 'mark-screen' : null">
    <div class="reader-frame" data-reader-frame>
      <div class="reader-content" data-reader-content>
        <!-- The toolbar above already says which page this is, so the page does not
             say it a second time; the heading is left for screen readers only. -->
        <h1 class="offscreen">Articles</h1>

        <!-- One row of filters, whichever level it is on: the categories, or the feeds
             of the category that is open. A row wider than the screen is turned a page
             at a time by filters.js, which is what the two arrows are for; without the
             script the row simply wraps.

             Ahead of the arrows, and so never turned out of reach, are the two controls
             that are not places: the way out of the level, and the unread switch. They
             are kept apart from the level by a rule and drawn differently from it — a
             switch that looked like a feed name read as a feed called "Unread". -->
        <div class="filters" data-strip>
          <!-- The arrow and the word are separate so that the narrowest screens can
               keep the arrow and drop the word; the label a screen reader is given
               stays whole either way. -->
          <a class="btn filter-nav" th:if="${backChip != null}"
             th:href="@{${backChip.href}}" aria-label="All categories">
            <span aria-hidden="true">←</span>
            <span class="nav-word" th:text="${backChip.label}">All</span>
          </a>
          <a class="btn filter-nav filter-mode"
             th:classappend="${modeChip.active} ? ' active'"
             th:href="@{${modeChip.href}}">
            <!-- Filled or hollow rather than marked or unmarked: a switch shows both of
                 its states, and the filled circle is the one the list already puts
                 against an unread title. -->
            <span class="mode-dot" aria-hidden="true"
                  th:text="${modeChip.active} ? '●' : '○'">○</span>
            <span th:text="${modeChip.label}">Unread</span>
          </a>
          <span class="filter-divide" aria-hidden="true"></span>
          <button class="btn strip-step" type="button" data-strip-prev aria-label="Earlier filters">‹</button>
          <div class="strip" data-strip-track>
            <a class="btn" th:each="chip : ${filterChips}"
               th:classappend="${chip.active} ? ' active'"
               th:href="@{${chip.href}}"
               th:text="${chip.label}">Category</a>
          </div>
          <button class="btn strip-step" type="button" data-strip-next aria-label="More filters">›</button>
        </div>

        <p th:if="${#lists.isEmpty(articles)}" class="muted">No articles.</p>
        <!-- data-reader-fill: the reader deals these rows out over the pages
             itself and spaces each page's rows to the bottom of the screen,
             rather than leaving the last page half empty. -->
        <ul class="item-list" data-reader-fill th:if="${!#lists.isEmpty(articles)}">
          <!-- The unread mark is always in the markup and merely hidden once read:
               turning a page marks articles read where the reader stands, and a mark
               that was removed outright would reflow the columns under them. -->
          <!-- Title and source stack in one column with the send button beside them,
               rather than under them: the button is the tallest thing in the entry,
               and standing it next to the two lines instead of below them is what
               lets a screen hold a third more articles. -->
          <li th:each="a : ${articles}"
              th:attr="data-article-id=${a.id}, data-read=${a.read} ? 'true' : 'false'">
            <div class="item-main">
              <a class="item-title" th:href="@{/articles/{id}(id=${a.id})}">
                <strong class="unread-mark" th:classappend="${a.read} ? ' read'">●</strong>
                <span th:text="${a.title}">Title</span>
              </a>
              <span class="meta">
                <span th:text="${a.feedTitle}">Feed</span>
                <span th:if="${a.publishedAt != null}" th:text="' · ' + ${#temporals.format(a.publishedAt, 'yyyy-MM-dd HH:mm')}"> · date</span>
                <span th:if="${a.sentAt != null}"> · sent</span>
              </span>
            </div>
            <form class="inline" data-send-form
                  th:action="@{/articles/{id}/send(id=${a.id})}"
                  th:attr="data-send-url=@{/articles/{id}/send-async(id=${a.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <!-- Sending from the list comes back to the list instead of opening the article. -->
              <input type="hidden" name="redirect" th:value="${listPath}"/>
              <button class="btn" type="submit">Send to Kindle</button>
            </form>
          </li>
        </ul>

        <!-- Where this page sits in the whole list. It reads under the list rather than
             above it: the first line of the screen is worth more than the count is.
             Unlike the row below it this is not a fallback for the pager, so it stays
             on while the pager runs; fillPages() charges it to the last page, which is
             the page it appears on. -->
        <p class="meta list-range" th:if="${!#lists.isEmpty(articles)}"
           th:text="${firstIndex} + '–' + ${lastIndex} + ' of ' + ${total} + ' articles'">1–20 of 20 articles</p>

        <!-- Hidden as a whole while the pager turns the pages: the buttons inside
             are the fallback for a browser without it, and the row's own spacing
             would otherwise take a strip off the bottom of the last page. -->
        <div class="pagination reader-hide-when-paged" th:if="${!#lists.isEmpty(articles)}">
          <!-- Paging forward posts this form. Whether that also marks the articles
               read is a Settings choice; there is no separate skip-without-marking
               link, because Next page is the only way the list moves on. -->
          <form th:action="@{/items/advance}" method="post" id="advance" class="inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="feed" th:if="${feedId != null}" th:value="${feedId}"/>
            <input type="hidden" name="category" th:if="${category != null}" th:value="${category}"/>
            <input type="hidden" name="unread" th:if="${unread}" value="true"/>
            <input type="hidden" name="snapshot" th:if="${snapshot != null}" th:value="${snapshot}"/>
            <input type="hidden" name="page" th:value="${page}"/>
            <input type="hidden" name="id" th:each="a : ${articles}" th:value="${a.id}"/>
            <!-- The pager turns pages where the reader script runs; where it cannot,
                 this is the only way forward. It carries the same label as the pager's
                 last page, because it is the same step. The row around it is hidden
                 while the pager runs, so the class is not needed on the button. -->
            <button class="btn" type="submit"
                    th:text="${forwardLabel}">Next articles</button>
          </form>
          <a class="btn" th:if="${page > 1}"
             th:href="@{/items(feed=${feedId}, category=${category}, unread=${unread} ? true : null, snapshot=${snapshot}, page=${page - 1})}">Newer articles</a>
        </div>
      </div>
    </div>
    <!-- How much of this list is behind the reader, and how many articles are still
         waiting. It sits directly under the page because that is where the eye
         already is when the last line runs out. -->
    <div class="unread-meter" th:if="${total > 0}" data-unread-meter
         th:attr="data-unread-total=${total}, data-unread-left=${unreadLeft}">
      <!-- The bar draws the count beside it; a reader who cannot see it is told the
           same thing in words, so the bar itself is not announced twice. -->
      <span class="unread-meter-track" aria-hidden="true">
        <span class="unread-meter-fill" data-unread-fill
              th:style="'width:' + ${readThroughPercent} + '%'"></span>
      </span>
      <span class="unread-meter-count" data-unread-count
            th:text="${unreadLeft == 0} ? 'All read' : ${unreadLeft} + ' unread'">20 unread</span>
    </div>
    <nav class="pager" data-reader-pager>
      <button class="btn" type="button" data-reader-prev>Previous page</button>
      <span class="pager-label" data-reader-label>Page 1</span>
      <button class="btn" type="button" data-reader-next>Next page</button>
    </nav>
  </div>

  <!-- Posted by the reader as each screen is turned past, so that a page turn
       inside the loaded list marks what it left behind. The visible fallback for
       browsers without the reader is the forward button above. -->
  <form th:if="${markReadOnNextPage and !#lists.isEmpty(articles)}"
        id="mark-screen" th:action="@{/items/read}" method="post" hidden>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" name="feed" th:if="${feedId != null}" th:value="${feedId}"/>
    <input type="hidden" name="category" th:if="${category != null}" th:value="${category}"/>
  </form>
</div>
<!-- Before the reader: clipping the filter row to one line changes how much room
     is left for the article list, and the reader measures that on load. -->
<script th:src="@{/js/filters.js}"></script>
<script th:src="@{/js/reader.js}"></script>
</body>
</html>
