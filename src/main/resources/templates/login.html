<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Log in — Kindle RSS</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="wrap">
  <header class="app">
    <span class="brand">Kindle RSS</span>
  </header>

  <h1>Log in</h1>
  <div th:if="${message}" class="flash" th:text="${message}"></div>
  <div th:if="${param.error}" class="flash error">Invalid e-mail or password.</div>
  <div th:if="${param.logout}" class="flash">You have been logged out.</div>
  <div th:if="${param.deleted}" class="flash">Your account has been deleted.</div>

  <form th:action="@{/login}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label for="username">E-mail</label>
    <input id="username" name="username" type="email" autocomplete="username" required/>

    <label for="password" style="margin-top:0.75rem">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required/>

    <label class="check" style="margin-top:0.75rem">
      <input type="checkbox" name="remember-me" value="true"/>
      Remember me for 1 year
    </label>

    <div class="row" style="margin-top:1rem">
      <button class="btn" type="submit">Log in</button>
    </div>
  </form>

  <p class="meta" style="margin-top:1rem">
    <a th:href="@{/register}">Create an account</a> ·
    <a th:href="@{/forgot-password}">Forgot password?</a>
  </p>
</div>
</body>
</html>
