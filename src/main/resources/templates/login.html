<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:classappend="${einkLayout} ? ('eink' + ${einkTypeClasses})">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Log in — Extrablatt</title>
  <th:block th:replace="~{fragments/page-styles :: assets}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/app-shell :: brandBar}"></th:block>
<main id="main" class="wrap">

  <h1>Log in</h1>
  <p class="meta">A newsreader for your Kindle.</p>
  <div th:if="${message}" class="flash" th:text="${message}"></div>
  <div th:if="${param.unverified}" class="flash error">
    Confirm your e-mail address before logging in. Use the confirmation link in your inbox.
  </div>
  <div th:if="${param.error}" class="flash error">Invalid e-mail or password.</div>
  <div th:if="${param.logout}" class="flash">You have been logged out.</div>
  <div th:if="${param.deleted}" class="flash">Your account has been deleted.</div>

  <form th:action="@{/login}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label for="username">E-mail</label>
    <input id="username" name="username" type="email" autocomplete="username"
           th:value="${email}" required/>

    <label for="password" class="space-top-sm">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required/>
    <label class="check">
      <input type="checkbox" id="show-password" data-show-password="password"/>
      Show password
    </label>

    <label class="check space-top-sm">
      <input type="checkbox" name="remember-me" value="true"/>
      Remember me for 1 year
    </label>

    <div class="row space-top">
      <button class="btn primary" type="submit">Log in</button>
    </div>
  </form>

  <p class="meta space-top">
    <a th:href="@{/register}">Create an account</a> ·
    <a th:href="@{/forgot-password}">Forgot password?</a>
  </p>
  <div th:replace="~{fragments/site-footer :: siteFooter}"></div>
</main>
<script th:src="@{/js/show-password.js}"></script>
</body>
</html>
