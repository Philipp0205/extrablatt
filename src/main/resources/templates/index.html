<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Kindle RSS</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="wrap">
  <header class="app">
    <a class="brand" th:href="@{/}">Kindle RSS</a>
    <nav class="top">
      <a th:href="@{/}">Feeds</a>
      <a th:href="@{/items}">Articles</a>
      <a th:href="@{/items(unread=true)}">Unread</a>
      <form class="inline" th:action="@{/refresh}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">Refresh</button>
      </form>
      <form class="inline" th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">Log out</button>
      </form>
    </nav>
  </header>

  <div th:if="${message}" class="flash" th:text="${message}"></div>
  <div th:if="${error}" class="flash error" th:text="${error}"></div>

  <h1>Feeds</h1>
  <p class="meta" th:text="'Unread across all feeds: ' + ${totalUnread}">Unread: 0</p>

  <h2>Add feed</h2>
  <form th:action="@{/feeds}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <label for="url">Feed or homepage URL</label>
    <div class="row">
      <input id="url" name="url" type="url" required placeholder="https://example.com/feed.xml"/>
      <button class="btn" type="submit">Add</button>
    </div>
  </form>

  <h2>Your feeds</h2>
  <p th:if="${#lists.isEmpty(feeds)}" class="muted">No feeds yet.</p>
  <ul class="feed-list" th:if="${!#lists.isEmpty(feeds)}">
    <li th:each="feed : ${feeds}">
      <div>
        <a th:href="@{/items(feed=${feed.id})}" th:text="${feed.title}">Title</a>
        <span class="badge" th:text="${feed.unreadCount}">0</span>
      </div>
      <div class="meta">
        <span th:text="${feed.url}">url</span>
      </div>
      <div class="meta" th:if="${feed.lastError != null}">
        Last error: <span th:text="${feed.lastError}">error</span>
      </div>
      <div class="actions">
        <a class="btn" th:href="@{/items(feed=${feed.id}, unread=true)}">Unread</a>
        <form class="inline" th:action="@{/feeds/{id}/delete(id=${feed.id})}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit">Delete</button>
        </form>
      </div>
    </li>
  </ul>

  <footer class="build-info">
    Version <span th:text="${appVersion.number}">development build</span> ·
    revision <span th:text="${appVersion.revision}">unknown</span> ·
    built <span th:text="${appVersion.builtAt}">unknown</span>
  </footer>
</div>
</body>
</html>
