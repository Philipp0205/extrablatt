spring:
  application:
    name: kindle-rss
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kindle_rss}
    username: ${DATABASE_USER:kindle}
    password: ${DATABASE_PASSWORD:kindle}
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 10MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # Local HTTP must work; production profile sets secure=true (honor HTTPS via proxy headers).
        secure: false
        same-site: lax
        http-only: true

management:
  endpoints:
    web:
      exposure:
        # /actuator/info reports version, build time and git revision. It needs a
        # login, unlike /actuator/health.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

app:
  password: ${APP_PASSWORD:}
  kindle-email: ${KINDLE_EMAIL:}
  mail-from: ${MAIL_FROM:}
  remember-me-key: ${REMEMBER_ME_KEY:kindle-rss-remember-me-change-me}
  http:
    connect-timeout: 10s
    read-timeout: 20s
    max-bytes: 2097152

logging:
  level:
    com.kindlerss: INFO
