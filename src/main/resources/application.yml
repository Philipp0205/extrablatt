spring:
  application:
    name: extrablatt
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kindle_rss}
    username: ${DATABASE_USER:kindle}
    password: ${DATABASE_PASSWORD:kindle}
  flyway:
    enabled: true
    # Off by default: migrations must apply in version order, so a version
    # gap (a branch that skipped one) fails the boot instead of silently
    # running an older script on top of newer schema. Set FLYWAY_OUT_OF_ORDER=true
    # for one deploy to repair a database that is genuinely missing a lower
    # version (staging once applied V11 from a branch without V10), then unset it.
    out-of-order: ${FLYWAY_OUT_OF_ORDER:false}
  mail:
    # Defaults target Resend's SMTP endpoint. Username is the literal word "resend"
    # and the password is a Resend API key (starts with re_). A verified sending
    # domain is required. Any SMTP provider works by overriding these vars.
    host: ${SMTP_HOST:smtp.resend.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:resend}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  thymeleaf:
    cache: false
    servlet:
      # Render the whole page before any of it is sent.
      #
      # Thymeleaf otherwise writes as it goes, which fills Tomcat's 8 KB response
      # buffer and commits the response part-way through rendering. Nothing can
      # touch the session after that, and a first-time visitor's login form needs
      # to: its CSRF token is created on demand, and creating one starts a session.
      # A long page can spend that 8 KB before the session is touched. Buffering
      # also means an error part-way through rendering still produces the error
      # page rather than half a document.
      produce-partial-output-while-processing: false
  servlet:
    multipart:
      max-file-size: 10MB
  web:
    resources:
      chain:
        # Turns on the filter that rewrites @{/js/app.js} and @{/css/app.css} in a
        # template into the content-addressed name WebConfig serves it under. Without it the templates
        # would keep asking for the plain name, which cannot be cached for long.
        enabled: true

server:
  port: ${PORT:8080}
  # Honors X-Forwarded-Proto / -Host / -Port for redirects and absolute URLs. It
  # also makes getRemoteAddr() return the leftmost X-Forwarded-For entry, which the
  # client controls, so nothing that needs the client's address may use that:
  # ClientIpResolver reads the original socket peer and header instead.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # Local HTTP must work; production profile sets secure=true (honor HTTPS via proxy headers).
        secure: false
        same-site: lax
        http-only: true

management:
  endpoints:
    web:
      exposure:
        # /actuator/info reports version, build time and git revision. It needs a
        # login, unlike /actuator/health.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

app:
  # Shared, provider-verified sender used for account e-mail and Kindle delivery.
  # Hosted Extrablatt uses mail@extrablatt.app (not a Kindle-branded local part).
  mail-from: ${MAIL_FROM:}
  # Comma-separated recipient domains mail may go to (subdomains included).
  # Blank allows any. Addresses under .invalid are refused either way; the
  # staging sync rewrites accounts to those. Staging example: kindle.com,example.org
  mail-allowed-recipient-domains: ${MAIL_ALLOWED_RECIPIENT_DOMAINS:}
  # Public base URL used to build links in verification / password-reset e-mails.
  public-url: ${APP_PUBLIC_URL:http://localhost:8080}
  # Comma-separated account e-mails granted access to /admin telemetry and
  # per-user send controls. Keep this in deployment secrets.
  admin-emails: ${ADMIN_EMAILS:}
  remember-me-key: ${REMEMBER_ME_KEY:kindle-rss-remember-me-change-me}
  # Proxies allowed to add to X-Forwarded-For, as comma-separated CIDRs. The rate
  # limiter walks that header from the right, skipping these, and keys on the first
  # address that is not one of them; a request whose socket peer is not one of
  # them is keyed on the peer and its header is ignored. Blank means loopback,
  # RFC 1918, 100.64.0.0/10 (Railway's private network), 169.254.0.0/16, ::1,
  # fc00::/7 and fe80::/10. Setting it replaces that list.
  trusted-proxies: ${TRUSTED_PROXIES:}
  # Also trust Cloudflare's published edge ranges (hardcoded in ClientIpResolver).
  # Turn off when Cloudflare is not in front of the app.
  trust-cloudflare: ${TRUST_CLOUDFLARE:true}
  http:
    connect-timeout: 10s
    read-timeout: 20s
    max-bytes: 2097152
    # Upper bound for one whole fetch, redirects included.
    total-timeout: 30s
  feeds:
    # Entries a refresh asks a feed for; 0 fetches feed URLs exactly as entered.
    max-entries: ${FEED_MAX_ENTRIES:100}
  articles:
    page-size: ${ARTICLE_PAGE_SIZE:50}
  limits:
    # Per-account guardrails for open registration.
    max-feeds-per-user: ${MAX_FEEDS_PER_USER:50}
    max-sends-per-day: ${MAX_SENDS_PER_DAY:50}
  billing:
    # Off unless an operator deliberately turns it on. Off, nothing is charged, no
    # prices or cancellation page exist, and every account keeps the full
    # app.limits.* allowances — which is what a self-hosted copy needs, since it is
    # not the one collecting the money.
    enabled: ${BILLING_ENABLED:false}
    # stripe or paddle. Decides which signature scheme the webhook expects.
    provider: ${BILLING_PROVIDER:}
    # Webhook signing secret (Stripe whsec_…, Paddle pdl_ntfset_…). The callback is
    # the only thing that grants a subscription, so this is what stands between an
    # account and a free upgrade.
    webhook-secret: ${BILLING_WEBHOOK_SECRET:}
    # Hosted checkout links, one per interval (Stripe payment link or Paddle checkout).
    monthly-checkout-url: ${BILLING_MONTHLY_CHECKOUT_URL:}
    yearly-checkout-url: ${BILLING_YEARLY_CHECKOUT_URL:}
    # Provider-hosted page for changing a payment method.
    portal-url: ${BILLING_PORTAL_URL:}
    # Where cancellation notices go, so the money is stopped at the provider.
    operator-email: ${BILLING_OPERATOR_EMAIL:}
    # Query parameter that carries the account id into the checkout and comes back
    # on the callback. Stripe payment links use client_reference_id; Paddle wants
    # custom_data[user_id].
    reference-param: ${BILLING_REFERENCE_PARAM:client_reference_id}
    # Gross prices in euro cents: a consumer price in the EU is the total paid.
    # 399 = €3.99 a month; 3588 = €35.88 paid once for 12 months (€2.99/month).
    monthly-price-cents: ${BILLING_MONTHLY_PRICE_CENTS:399}
    yearly-price-cents: ${BILLING_YEARLY_PRICE_CENTS:3588}
    # After the trial, unpaid accounts get this many Kindle sends a calendar month
    # and this many feeds. Zero (the default) means reading stays, sending does not.
    free-max-sends-per-month: ${BILLING_FREE_SENDS_PER_MONTH:0}
    free-max-feeds: ${BILLING_FREE_MAX_FEEDS:0}
    # Complimentary week of the full paid plan for a new account. No card required.
    trial-days: ${BILLING_TRIAL_DAYS:7}
    # Days of continued access after a renewal fails, or after a renewal
    # confirmation goes missing. A declined card should not cut off a reader
    # mid-morning. Trials do not get this extra week.
    grace-days: ${BILLING_GRACE_DAYS:7}
    # A webhook event that cannot be applied yet (typically a subscription event
    # that overtook the checkout naming its account) is retried from the stored
    # payload, waiting this long before the first retry and doubling each time up
    # to six hours, until it has been tried this many times in total.
    webhook-max-attempts: ${BILLING_WEBHOOK_MAX_ATTEMPTS:12}
    webhook-retry-backoff: ${BILLING_WEBHOOK_RETRY_BACKOFF:PT1M}
  retention:
    # Art. 5(1)(e) GDPR: personal data may be kept only as long as it is needed.
    # These are the periods after which the nightly sweep clears things out. Set any
    # of them to 0 to switch that sweep off. Nothing here removes something a reader
    # would miss — see docs/data-protection.md for the reasoning behind each figure.
    cron: ${RETENTION_CRON:0 40 3 * * *}
    # Kindle delivery history. The rolling quota reads one day of it and the
    # telemetry page seven; beyond that it only fed a lifetime counter.
    send-event-days: ${RETENTION_SEND_EVENT_DAYS:730}
    # Raw payment-provider webhook bodies, which can carry a customer's name and
    # e-mail. The event id is kept for ever regardless, because it is what makes a
    # replayed webhook a no-op.
    billing-payload-days: ${RETENTION_BILLING_PAYLOAD_DAYS:90}
    # Spent or expired e-mail confirmation and password-reset links.
    used-token-days: ${RETENTION_USED_TOKEN_DAYS:30}
    # Cached extracted article text, for articles already read and not saved. It is
    # re-extracted from the article's own address when next needed, so clearing it
    # costs a refetch and nothing else.
    article-cache-days: ${RETENTION_ARTICLE_CACHE_DAYS:365}
  newsletters:
    # Domain newsletter inboxes live under, e.g. news.yourdomain.com (needs MX
    # records pointed at an inbound e-mail provider). Blank disables the feature.
    inbound-domain: ${NEWSLETTER_INBOUND_DOMAIN:}
    # Shared secret the provider sends in the X-Newsletter-Secret header (or as the
    # webhook URL's Basic auth password). ?secret= in the URL still works, deprecated.
    inbound-secret: ${NEWSLETTER_INBOUND_SECRET:}
    # Largest inbound message accepted, in bytes (default 10 MiB).
    max-body-bytes: ${NEWSLETTER_MAX_BODY_BYTES:10485760}

logging:
  level:
    com.kindlerss: INFO
