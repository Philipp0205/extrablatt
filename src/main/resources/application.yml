spring:
  application:
    name: kindle-rss
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kindle_rss}
    username: ${DATABASE_USER:kindle}
    password: ${DATABASE_PASSWORD:kindle}
  flyway:
    enabled: true
  mail:
    # Defaults target Resend's SMTP endpoint. Username is the literal word "resend"
    # and the password is a Resend API key (starts with re_). A verified sending
    # domain is required. Any SMTP provider works by overriding these vars.
    host: ${SMTP_HOST:smtp.resend.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:resend}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 10MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # Local HTTP must work; production profile sets secure=true (honor HTTPS via proxy headers).
        secure: false
        same-site: lax
        http-only: true

management:
  endpoints:
    web:
      exposure:
        # /actuator/info reports version, build time and git revision. It needs a
        # login, unlike /actuator/health.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

app:
  # Shared, provider-verified sender used for account e-mail and Kindle delivery.
  mail-from: ${MAIL_FROM:}
  # Public base URL used to build links in verification / password-reset e-mails.
  public-url: ${APP_PUBLIC_URL:http://localhost:8080}
  remember-me-key: ${REMEMBER_ME_KEY:kindle-rss-remember-me-change-me}
  http:
    connect-timeout: 10s
    read-timeout: 20s
    max-bytes: 2097152
  feeds:
    # Entries a refresh asks a feed for; 0 fetches feed URLs exactly as entered.
    max-entries: ${FEED_MAX_ENTRIES:100}
  articles:
    page-size: ${ARTICLE_PAGE_SIZE:50}
  limits:
    # Per-account guardrails for open registration.
    max-feeds-per-user: ${MAX_FEEDS_PER_USER:50}
    max-sends-per-day: ${MAX_SENDS_PER_DAY:50}

logging:
  level:
    com.kindlerss: INFO
