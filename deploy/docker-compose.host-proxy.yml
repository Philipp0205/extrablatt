# Overlay for a VPS that already terminates TLS with its own reverse proxy.
# Apply after the base file:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.host-proxy.yml --env-file .env up -d --build
services:
  app:
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8090}:8080"

  caddy:
    # Parked behind a profile that is never enabled, so the bundled proxy does
    # not compete with the host proxy for ports 80/443.
    profiles:
      - bundled-proxy
