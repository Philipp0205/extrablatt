# Copy production Postgres into the staging environment, scrubbed.
#
# Staging has its own database. This job dumps production and loads it onto
# staging in one transaction together with deploy/staging-scrub.sql, so
# testers see live-shaped data without real addresses, credentials or
# newsletter mail (Flyway on staging must never run against prod either).
#
# Repository secrets:
#   RAILWAY_API_TOKEN    Railway account or workspace token. A project token
#                        cannot register the temporary SSH key the job needs.
#   STAGING_KEEP_EMAILS  optional; accounts left unscrubbed (testers, admins)
# Repository variables (optional):
#   RAILWAY_PROJECT_ID   defaults to the hosted Extrablatt project
# When RAILWAY_API_TOKEN is missing the job skips (exit 0).

name: Sync staging database

on:
  workflow_dispatch:
  schedule:
    # Daily 05:15 UTC: close enough to production without wiping staging on
    # every code deploy.
    - cron: '15 5 * * *'

permissions:
  contents: read

concurrency:
  group: sync-staging-db
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check Railway token
        id: auth
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "RAILWAY_API_TOKEN is not set; skipping staging database sync."
            echo "Add a repository secret named RAILWAY_API_TOKEN (a Railway account or workspace token) to enable this job."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Railway CLI
        if: steps.auth.outputs.skip != 'true'
        run: npm install -g @railway/cli@5.71.0

      - name: Dump production, restore and scrub onto staging
        if: steps.auth.outputs.skip != 'true'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          STAGING_KEEP_EMAILS: ${{ secrets.STAGING_KEEP_EMAILS }}
        run: bash deploy/sync-staging-db.sh
