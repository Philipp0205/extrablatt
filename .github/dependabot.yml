# Weekly update PRs target main.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    target-branch: main
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /marketing
    target-branch: main
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /deploy
    target-branch: main
    schedule:
      interval: weekly
